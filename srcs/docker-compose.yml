services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    restart: unless-stopped
    networks:
      - inception
    
  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    restart: unless-stopped
    networks:
      - inception
  
  nginx:
    build: ./requirements/nginx
    image: nginx
    restart: unless-stopped
    networks:
      - inception

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    name: mariadb_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${HOST_LOGIN}/data/mariadb
  
  wordpress_data:
    name: wordpress_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${HOST_LOGIN}/data/wordpress
